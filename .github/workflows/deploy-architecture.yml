# Build the architecture diagram (scripts/architecture/reactflow, a Vite app)
# and push the static output to the gh-pages branch of a SEPARATE repo, which
# then serves it via GitHub Pages — automatically, on every change.
#
# Auth: pushes to the target repo with an SSH deploy key (write). The private
# key is the ACTIONS_DEPLOY_KEY secret here; its public half is a write deploy
# key on the target repo. (The built-in GITHUB_TOKEN can't push cross-repo.)
# Remaining setup: in the target repo, Settings → Pages → Deploy from a branch
# → gh-pages (after the first run creates that branch).
# Change `external_repository` below if your repo name differs.

name: deploy-architecture

on:
  push:
    branches: [main]
    paths:
      - "scripts/architecture/reactflow/**"
      - ".github/workflows/deploy-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-architecture
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/architecture/reactflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/architecture/reactflow/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      - name: Push to the Pages repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: dalmasonto/umbral-architecture # ← change if needed
          publish_branch: gh-pages
          publish_dir: ./scripts/architecture/reactflow/dist # repo-root-relative
          force_orphan: true
          commit_message: "deploy: umbral architecture ${{ github.sha }}"
