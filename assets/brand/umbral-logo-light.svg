<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-label="umbral">
  <defs>
    <radialGradient id="umbra" cx="40%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1b1840"/>
      <stop offset="0.7" stop-color="#0c0d1c"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <linearGradient id="corona" x1="72" y1="20" x2="26" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c86a"/>
      <stop offset="0.42" stop-color="#9d82ff"/>
      <stop offset="1" stop-color="#6d5cf0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="96" height="96" fill="#000"/>
      <circle cx="55" cy="41" r="31" fill="#fff"/>
      <circle cx="45" cy="51" r="30" fill="#000"/>
    </mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <!-- mark (reads on light: dark umbra body + warm/violet crescent) -->
  <g>
    <circle cx="45" cy="51" r="30" fill="url(#umbra)"/>
    <rect width="96" height="96" fill="url(#corona)" mask="url(#crescent)" opacity="0.5" filter="url(#soft)"/>
    <rect width="96" height="96" fill="url(#corona)" mask="url(#crescent)"/>
    <circle cx="71" cy="27" r="6" fill="#fff" opacity="0.5" filter="url(#soft)"/>
    <circle cx="71" cy="27" r="2.8" fill="#fff"/>
  </g>

  <!-- wordmark on light -->
  <text x="106" y="62" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1">
    <tspan fill="#141126">umbr</tspan><tspan fill="#7c5cf0">al</tspan>
  </text>
</svg>
