[package]
name = "umbral-email"
description = "SMTP + template-driven transactional email for umbral."
workspace = "../.."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# HTTP API email backend (Resend / SendGrid). Pulls in `reqwest` only when
# enabled, so an SMTP/console-only app never compiles the HTTP client. Off by
# default — mirrors umbral-storage's `s3` feature pattern.
api = ["dep:reqwest"]
# `auth_mailer()`: an `AuthMailer` adapter that delegates umbral-auth's
# verification / password-reset emails to this plugin's configured backend
# (gaps4 #82b). Optional and off by default so an app with no umbral-auth
# dependency never compiles it in. This is the acyclic direction of the
# email/auth pairing — umbral-auth does NOT gain a reciprocal dep on
# umbral-email (see docs/decisions/2026-06-28-auth-full-surface.md and the
# note on umbral-auth's Cargo.toml).
auth = ["dep:umbral-auth"]

[dependencies]
umbral = { path = "../../crates/umbral", version = "0.0.12" }
# Optional adapter target for `auth_mailer()`. See the `auth` feature above.
umbral-auth = { path = "../umbral-auth", version = "0.0.12", optional = true, default-features = false }
# Powers the public `EmailBackend` trait (custom senders) and the `auth`
# feature's `umbral_auth::AuthMailer` adapter.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tracing = "0.1"
base64 = "0.22"
# Optional HTTP client for the API backend. `json` for serde_json bodies,
# rustls TLS so the build doesn't need OpenSSL; default-features off to stay
# lean. Only built under the `api` feature.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }
# SMTP transport. `lettre` is the standard Rust SMTP client. Use the
# tokio runtime variant; rustls so the build doesn't need OpenSSL
# system libs.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
    "ring",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tempfile = "3"
